<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NookTheory — On Hold</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#1e1e1b}
    main{min-height:100vh;display:grid;place-items:center;padding:32px;box-sizing:border-box}
    section{max-width:680px;text-align:center}
    .mark{font-size:14px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
    h1{font-size:clamp(42px,8vw,78px);line-height:.98;margin:22px 0}
    p{font-size:18px;line-height:1.6;opacity:.72}
  </style>
</head>
<body>
  <main>
    <section>
      <div class="mark">NookTheory</div>
      <h1>Project on hold.</h1>
      <p>NookTheory is currently paused. Automation, publishing, recommendations and scheduled activity are disabled until the project is explicitly resumed.</p>
    </section>
  </main>
</body>
</html>
